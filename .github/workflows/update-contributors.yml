name: 更新贡献者信息

on:
  schedule:
    # 每两周运行一次（每月1日和15日 UTC 02:00，北京时间10:00）
    - cron: '0 2 1,15 * *'
  workflow_dispatch:  # 允许手动触发
  push:
    branches:
      - main
      - master
      - feature/update-contributors  # 测试分支
    paths:
      - '.github/workflows/update-contributors.yml'
      - 'src/one_dragon_qt/utils/update_contributors.py'

permissions:
  contents: write  # 允许写入仓库内容
  actions: read    # 允许读取actions

jobs:
  update-contributors:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0  # 获取完整历史记录

    - name: 设置Python环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install requests pyyaml

    - name: 更新贡献者信息
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        QQ_CHANNEL_TOKEN: ${{ secrets.QQ_CHANNEL_TOKEN }}
        QQ_CHANNEL_API: ${{ secrets.QQ_CHANNEL_API }}
      run: |
        python src/one_dragon_qt/utils/update_contributors.py

    - name: 检查文件变化
      id: check_changes
      run: |
        if git diff --quiet HEAD -- contributors.yaml; then
          echo "No changes detected"
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "Changes detected"
          echo "changed=true" >> $GITHUB_OUTPUT
        fi

    - name: 提交更改
      if: steps.check_changes.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add contributors.yaml
        git commit -m "自动更新贡献者信息 - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

    - name: 推送更改
      if: steps.check_changes.outputs.changed == 'true'
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}

    - name: 上传贡献者信息（可选）
      if: steps.check_changes.outputs.changed == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: contributors-info
        path: contributors.yaml
        retention-days: 30

    - name: 创建Issue（如果更新失败）
      if: failure()
      uses: actions/github-script@v6
      with:
        script: |
          const title = '贡献者信息更新失败';
          const body = `## 贡献者信息更新失败
          
          工作流运行ID: ${context.runId}
          运行时间: ${new Date().toISOString()}
          分支: ${context.ref}
          
          请检查工作流日志以获取详细信息：
          https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
          
          可能的原因：
          - GitHub API访问限制
          - QQ频道API访问问题
          - 网络连接问题
          - 脚本错误
          
          请手动检查并修复问题。`;
          
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: title,
            body: body,
            labels: ['bug', 'automation']
          });
